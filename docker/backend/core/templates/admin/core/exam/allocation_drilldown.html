<span id="allocation_drilldown_container" style="display: flex; gap: 10px; margin-bottom: 5px">
  <select id="select_sem" style="padding: 4px">
    <option value="">-- Start with Semester --</option>
  </select>
  <select id="select_course" style="padding: 4px; display: none">
    <option value="">-- Select Course --</option>
  </select>
  <select id="select_section" style="padding: 4px; display: none">
    <option value="">-- Pick Section --</option>
  </select>
  <small id="drilldown_status" style="color: green; display: none">Matched Allocation</small>
</span>

<script>
  (function ($) {
    $(document).ready(function () {
      let dataHierarchy = {};

      // Fetch data
      $.getJSON("/admin/api/allocations/", function (data) {
        console.log("Hierarchy data:", data);
        dataHierarchy = data;

        // Populate Semester
        const sems = Object.keys(data).sort((a, b) => parseInt(a) - parseInt(b));
        sems.forEach((sem) => {
          $("#select_sem").append(new Option(`Semester ${sem}`, sem));
        });
      });

      // Event: Semester Changed
      $("#select_sem").change(function () {
        const sem = $(this).val();
        const $course = $("#select_course");
        const $section = $("#select_section");

        $course.empty().append(new Option("-- Select Course --", "")).hide();
        $section.empty().append(new Option("-- Pick Section --", "")).hide();
        $("#drilldown_status").hide();

        if (sem && dataHierarchy[sem]) {
          const courses = Object.keys(dataHierarchy[sem]).sort();
          courses.forEach((c) => {
            $course.append(new Option(c, c));
          });
          $course.show();
        }
      });

      // Event: Course Changed
      $("#select_course").change(function () {
        const sem = $("#select_sem").val();
        const course = $(this).val();
        const $section = $("#select_section");

        $section.empty().append(new Option("-- Pick Section --", "")).hide();
        $("#drilldown_status").hide();

        if (sem && course && dataHierarchy[sem][course]) {
          const sections = dataHierarchy[sem][course];
          sections.forEach((sec) => {
            $section.append(new Option(`Section ${sec.section}`, sec.id)); // Value is Allocation ID
          });
          $section.show();
        }
      });

      // Event: Section Changed -> Update actual field
      $("#select_section").change(function () {
        const allocId = $(this).val();
        if (allocId) {
          const $target = $("#id_allocation");

          if ($target.length) {
            $target.val(allocId).trigger("change");

            if (!$target.find(`option[value='${allocId}']`).length) {
              const label = `${$("#select_course").val()} - Section ${$(this).find("option:selected").text().replace("Section ", "")}`;
              $target.append(new Option(label, allocId, true, true));
            }
            $target.val(allocId).trigger("change");

            $("#drilldown_status").show();
          } else {
            console.error("Target field #id_allocation not found");
          }
        }
      });

      // Insert Widget above current field
      const wrapper = $(".field-allocation div.related-widget-wrapper");
      if (wrapper.length) {
        $("#allocation_drilldown_container").insertBefore(wrapper);
      } else {
        // Fallback
        $(".field-allocation div").prepend($("#allocation_drilldown_container"));
      }
    });
  })(django.jQuery);
</script>
