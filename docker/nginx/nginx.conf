events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream backend_server {
        server backend:8000;
    }

    upstream frontend_server {
        server frontend:8080;
    }

    server {
        listen 80;
        server_name _;  # Accept all hostnames

        # Frontend
        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Vite HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Admin
        location /admin/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django static files (including admin CSS/JS)
        # Proxy to backend static handler so admin assets are always resolved.
        location /static/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block direct public access to sensitive files
        location /media/ {
            return 403;
        }

        location /Data/ {
            return 403;
        }

        # Internal-only routes (served only via X-Accel-Redirect from backend)
        location /_protected_media/ {
            internal;
            alias /app/mediafiles/;
            limit_except GET HEAD {
                deny all;
            }
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /_protected_data/ {
            internal;
            alias /app/Data/;
            limit_except GET HEAD {
                deny all;
            }
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
