services:
  db:
    image: postgres:15-alpine
    volumes:
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql # MAGIC LINE
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=exam_e
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ../scripts:/app/scripts
      - ../Data:/app/Data
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DEBUG=1
      - SECRET_KEY=changesmeplease-replace-in-production
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,[::1],backend
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=exam_e
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - COOKIE_SECURE=0              # set to 1 in production (HTTPS only)
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost,http://127.0.0.1
      - CSRF_TRUSTED_ORIGINS=http://localhost:8080,http://localhost,http://127.0.0.1
      # SMTP Settings (Loaded from .env by Docker Compose)
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}

  celery:
    build: ./backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
      - ../scripts:/app/scripts
      - ../Data:/app/Data
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DEBUG=1
      - SECRET_KEY=changesmeplease-replace-in-production
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=exam_e
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - COOKIE_SECURE=0
      # SMTP Settings
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    command: npm run dev
    stdin_open: true
    tty: true

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./backend/mediafiles:/app/mediafiles:ro
      - ../Data:/app/Data:ro # Serve paper contents directly
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

volumes:
  postgres_data:
